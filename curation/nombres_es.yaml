# Nombres en español de compuestos, enzimas y organismos (sección 4 de docs/MANUAL.md).
#
# Orden de prioridad al exportar (`metabo exportar`):
#   1. este archivo (curaduría de MetaboAtlas);
#   2. la etiqueta en español de Wikidata, solo si el ID tiene una sola etiqueta
#      distinta (raw/wikidata/, `metabo extraer wikidata`);
#   3. ninguno: `nombre.es` queda en null, marcado para traducción manual.
#
# Cada entrada lleva `en`, el nombre que tiene el ID en la fuente (ChEBI, ENZYME o
# NCBI Taxonomy). `metabo exportar` comprueba que coincida con los datos descargados,
# para que ningún ID se escriba de memoria (regla 5 de CLAUDE.md).
#
# Criterios de traducción (revisados el 2026-10-08):
# - Compuestos: traducción del nombre de ChEBI sin la carga entre paréntesis. Rhea usa
#   la especie iónica a pH 7,3, así que se nombra como anión ("piruvato", "glicerato").
#   "phosphonato" se traduce "fosfo" y "glycerone phosphate" por su nombre didáctico
#   "dihidroxiacetona fosfato". Los nucleótidos y el NAD conservan sus siglas.
# - CHEBI:15378 (hydron): Wikidata lo llama "hidrón"; se usa "H+", que es como lo
#   escriben las ecuaciones de los cursos.
# - Enzimas: nombre aceptado de ENZYME traducido; "kinase" se traduce "cinasa"
#   (forma recomendada en español) y se conserva el calificativo entre paréntesis.
#   Wikidata asigna EC 2.7.1.1 a "hexocinasa" y a "glucocinasa" a la vez, por eso las
#   enzimas no dependen de sus etiquetas.
# - Organismos: solo el nombre común que NCBI Taxonomy da en inglés.
compuestos:
