[project]
name = "metaboatlas-pipeline"
version = "0.1.0"
description = "Pipeline de datos de MetaboAtlas: descarga, normaliza, calcula cobertura y exporta el paquete de datos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "referencing>=0.35",
    "tenacity>=9.0",
]

[project.scripts]
metabo = "metabo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metabo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
