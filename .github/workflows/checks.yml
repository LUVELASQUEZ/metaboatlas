# Verificaciones de cada pull request (sección 15 de docs/MANUAL.md).
# Cubre el pipeline, los esquemas y la web (sin construirla: eso necesita datos).
name: Verificaciones

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline y esquemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Instalar dependencias
        working-directory: pipeline
        run: uv sync --locked

      - name: Linter
        working-directory: pipeline
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pruebas
        working-directory: pipeline
        run: uv run pytest

      - name: Validar configuración, organismos y fuentes
        working-directory: pipeline
        run: uv run metabo validate

      - name: Validar esquemas y ejemplos
        run: uv run schema/validate_examples.py

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos al día con schema/
        run: |
          npm run tipos
          git diff --exit-code -- lib/tipos

      - name: Linter
        run: npm run lint -- --max-warnings 0

      - name: Tipos de TypeScript
        run: npm run typecheck

      # La construcción y la revisión de accesibilidad necesitan el paquete de datos;
      # corren en el despliegue (web.yml), donde el pipeline lo genera.
      - name: Pruebas
        run: npm test
