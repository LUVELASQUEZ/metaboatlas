rhea:
  nombre: Rhea
  uso: redistribuir
  estado: verificada
  url: https://www.rhea-db.org
  licencia: CC BY 4.0
  licencia_url: https://www.rhea-db.org/help/license-disclaimer
  verificada: "2026-10-07"
  que_tomamos: >-
    Reacciones balanceadas, dirección, participantes ChEBI y número EC.
  condicion: >-
    Atribución (dar crédito a Rhea). Según LICENSE.txt del FTP, toda copia de sus
    archivos debe ir acompañada de su declaración de copyright.
  acceso:
    - ftp.expasy.org/databases/rhea/tsv/  # rhea-directions.tsv, rhea2ec.tsv, rhea2uniprot.tsv
    - ftp.expasy.org/databases/rhea/rhea-release.properties  # número y fecha del release
    - ftp.expasy.org/databases/rhea/txt/rhea-reactions.txt.gz  # ecuación con participantes ChEBI y EC de cada reacción
  plantillas:
    reaccion: https://www.rhea-db.org/rhea/{id}  # formato de /help/links (p. ej. /rhea/19253)
  cita_recomendada: |-
    Bansal P, Morgat A, Axelsen KB, Muthukrishnan V, Coudert E, Aimo L, Hyka-Nouspikel N, Gasteiger E, Kerhornou A, Neto TB, Pozzato M, Blatter MC, Ignatchenko A, Redaschi N, Bridge A
    Rhea, the reaction knowledgebase in 2022.
    Nucleic Acids Res. Epub:gkab1016 (2021).
  doi_cita: 10.1093/nar/gkab1016
  notas: >-
    Cita copiada de https://www.rhea-db.org/help/publications ("How to cite us"),
    enlazada desde la página de licencia. Licencia confirmada también en
    https://ftp.expasy.org/databases/rhea/LICENSE.txt. DOI comprobado en Crossref.
    Los participantes ChEBI se toman de txt/rhea-reactions.txt.gz: datos de Rhea en el
    formato de texto "KEGG REACTION" (solo el formato; no contiene datos de KEGG). Su
    README lo mantiene por compatibilidad y recomienda otros formatos; si se retira,
    la alternativa es rdf/rhea.rdf.gz.
    TODO: sparql.rhea-db.org (previsto en el manual) no se agregó a `acceso` porque
    ese dominio no se pudo verificar desde el entorno.

chebi:
  nombre: ChEBI
  uso: redistribuir
  estado: verificada
  url: https://www.ebi.ac.uk/chebi/
  licencia: CC BY 4.0
  licencia_url: https://www.ebi.ac.uk/chebi/about
  verificada: "2026-10-07"
  que_tomamos: >-
    Compuestos: nombre, fórmula, carga, masa, SMILES, InChI, sinónimos y
    ontología de roles.
  condicion: >-
    Atribución. Uso regido además por los términos de uso de EMBL-EBI
    (https://www.ebi.ac.uk/about/terms-of-use).
  acceso:
    - ftp.ebi.ac.uk/pub/databases/chebi/  # flat_files/: README y *.tsv.gz (solo IDs primarios)
  plantillas:
    compuesto: https://www.ebi.ac.uk/chebi/CHEBI:{id}  # comprobado con CHEBI:15361 (pyruvate)
  cita_recomendada: >-
    Malik, A., Arsalan, M., Moreno, C., Mosquera, J., Félix, E., Kizilören, T.,
    Muthukrishnan, V., Zdrazil, B., Leach, A. R., and O'Boyle, N. M. (2025). ChEBI:
    re-engineered for a sustainable future. Nucleic Acids Res.
  doi_cita: 10.1093/nar/gkaf1271
  notas: >-
    Licencia y cita copiadas de https://www.ebi.ac.uk/chebi/about (secciones
    "Licensing" y "To cite ChEBI"). DOI tomado del enlace de esa cita y comprobado
    en Crossref. El manual advierte que ChEBI cambió sus formatos de descarga: el
    FTP tiene ahora SDF/, flat_files/, generic_dumps/ y ontology/. El extractor usa
    flat_files/, la carpeta que su README recomienda para IDs primarios.
    CONTRADICCIÓN DE LICENCIA (revisada el 2026-10-07, release 256): el README de
    flat_files/ dice en un párrafo "Creative Commons Attribution-ShareAlike 4.0
    International License", pero en la misma página lista el archivo LICENSE como
    "Creative Commons Attribution 4.0 International License", y ese archivo
    (ftp.ebi.ac.uk/pub/databases/chebi/flat_files/LICENSE) contiene el texto legal de
    CC BY 4.0, sin ShareAlike. La página oficial https://www.ebi.ac.uk/chebi/about
    también declara CC BY 4.0. Decisión de la responsable del proyecto (2026-10-07):
    se usa CC BY 4.0, que es lo que dicen el texto legal y la página oficial. Si ChEBI
    aclara otra cosa, revisar esta entrada. El README pide que la atribución incluya
    la URL de ChEBI y el número de release.

uniprot:
  nombre: UniProtKB
  uso: redistribuir
  estado: verificada
  url: https://www.uniprot.org
  licencia: CC BY 4.0
  licencia_url: https://www.uniprot.org/help/license
  verificada: "2026-10-07"
  que_tomamos: >-
    Enzimas por organismo: EC, reacciones Rhea, genes, cofactores, GO y nivel
    de revisión.
  condicion: Atribución.
  acceso:
    - rest.uniprot.org/uniprotkb/stream
    - rest.uniprot.org/proteomes
  plantillas:
    proteina: https://www.uniprot.org/uniprotkb/{id}  # formato de /help/linking_to_uniprot
  cita_recomendada: |-
    The UniProt Consortium
    UniProt: the Universal Protein Knowledgebase in 2025
    Nucleic Acids Res. 53:D609–D617 (2025)
  doi_cita: 10.1093/nar/gkae1010
  notas: >-
    Núcleo del cálculo de cobertura. Descargar solo los proteomas de
    pipeline/organismos.yaml. Cita copiada de https://www.uniprot.org/help/publications
    ("How to cite us"; texto obtenido de https://rest.uniprot.org/help/publications,
    que sirve el mismo contenido en Markdown, sin las marcas de formato). DOI tomado
    del enlace de esa cita y comprobado en Crossref. La página permite citar en su
    lugar la publicación que mejor cubra el componente usado. Versión vigente al
    verificar: 2026_03 (2 de septiembre de 2026).
    Extractor (pipeline/metabo/sources/uniprot.py): por cada proteoma descarga su ficha
    (proteomes/<UP>?format=json) y sus proteínas revisadas y no revisadas
    (uniprotkb/stream, query=proteome:<UP>, TSV comprimido) con los campos del manual
    más cc_pathway, xref_reactome, xref_pdb y xref_alphafolddb. La versión se toma de
    la cabecera X-UniProt-Release de la API.

