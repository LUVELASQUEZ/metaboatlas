# Registro central de fuentes de MetaboAtlas (secciones 2, 3 y 11 de docs/MANUAL.md).
#
# Regla de oro: ningún dato entra al pipeline si su fuente no tiene aquí una entrada
# con la licencia verificada en su página oficial y la fecha de verificación.
#
# ESTADO: inventario inicial. NINGUNA entrada está verificada todavía.
# - Licencias, URLs y patrones de enlace se copiaron del manual, no de las páginas
#   oficiales; deben confirmarse una por una antes de usar la fuente.
# - `cita_recomendada` y `doi_cita` se copian textualmente de la página oficial
#   "How to cite" de cada base. Nunca se escriben de memoria.
# - Mientras `estado` sea "pendiente de verificar", el pipeline no debe descargar
#   datos de esa fuente.
#
# Campos de cada entrada:
#   nombre            Nombre de la base.
#   uso               redistribuir | por_verificar | solo_enlace
#   estado            pendiente de verificar | verificada
#   url               Página principal.
#   licencia          Licencia declarada (según el manual mientras no se verifique).
#   licencia_url      Página oficial de la licencia o de los términos de uso.
#   verificada        Fecha (AAAA-MM-DD) de la última verificación de la licencia.
#   que_tomamos       Qué datos se toman (o "nada" si es solo enlace).
#   condicion         Condición de uso que impone la licencia.
#   acceso            Descargas o API oficiales previstas (por confirmar al implementar).
#   plantillas        Plantillas de URL para construir enlaces; `{id}` es el ID sin prefijo.
#   cita_recomendada  Cita copiada textualmente de la página oficial de citación.
#   doi_cita          DOI del artículo recomendado.
#   notas             Observaciones.

# ---------------------------------------------------------------------------
