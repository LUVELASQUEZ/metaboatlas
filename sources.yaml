  cita_recomendada: |-
    Schoch CL, et al. NCBI Taxonomy: a comprehensive update on curation, resources and tools. Database (Oxford). 2020: baaa062.
    Sayers EW, et al. GenBank. Nucleic Acids Res. 2019. 47(D1):D94-D99.
  doi_cita: 10.1093/database/baaa062
  notas: >-
    Licencia según "Copyright Status of Webpages" y "Molecular Data Usage" de la
    página de políticas de NCBI. Citas copiadas de
    https://www.ncbi.nlm.nih.gov/Taxonomy/taxonomyhome.html/index.cgi?chapter=howcite,
    que recomienda los dos artículos y advierte que NCBI Taxonomy no es una
    autoridad taxonómica. Esa página no muestra DOI: se obtuvieron en Crossref por
    búsqueda bibliográfica (Schoch 2020, 10.1093/database/baaa062; Sayers 2019,
    10.1093/nar/gky989) y coinciden en título, revista, año y páginas. `doi_cita`
    guarda el de Schoch, el artículo específico de Taxonomy.

